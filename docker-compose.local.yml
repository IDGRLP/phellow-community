# Local Development Environment
# Mix of containerized and local services
# App runs locally, only infrastructure in containers
# Usage: docker-compose -f docker-compose.local.yml up

name: inkapp-local

services:
  # PostgreSQL Database
  db:
    container_name: inkapp-db-local
    image: postgres:17
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phellow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-phellow_local}
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
      - ./samples/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -d ${POSTGRES_DB:-phellow_local} -U
            ${POSTGRES_USER:-phellow}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot DB schema sync via `drizzle-kit push --force`. Pushes
  # src/lib/server/db/schema.ts directly to Postgres (no migration files),
  # matching the `pnpm db:push` workflow used on the host. Runs in a vanilla
  # node:22-alpine container so the host's macOS node_modules (with native
  # binaries) doesn't pollute the Linux runtime — deps install into the
  # `db_migrate_node_modules` named volume, cached by pnpm-lock.yaml hash so
  # only the first `up` (and any lockfile change) pays the install cost.
  db-migrate:
    container_name: inkapp-db-migrate-local
    image: node:22-alpine
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app
    environment:
      POSTGRES_URL: postgresql://${POSTGRES_USER:-phellow}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-phellow_local}
    volumes:
      - .:/app
      - db_migrate_node_modules:/app/node_modules
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        corepack enable >/dev/null 2>&1
        LOCKHASH_FILE=/app/node_modules/.db-migrate-lockhash
        CURRENT=$$(md5sum /app/pnpm-lock.yaml | cut -d ' ' -f1)
        if [ ! -f "$$LOCKHASH_FILE" ] || [ "$$(cat "$$LOCKHASH_FILE")" != "$$CURRENT" ]; then
          echo "db-migrate: installing dependencies into container volume (first run or lockfile changed)..."
          pnpm install --frozen-lockfile --silent
          echo "$$CURRENT" > "$$LOCKHASH_FILE"
        else
          echo "db-migrate: dependencies up to date"
        fi
        echo "db-migrate: running drizzle-kit push --force..."
        pnpm exec drizzle-kit push --force
    restart: "no"

  # One-shot init container: rewrites samples/mockoon.json with the latest
  # qres snapshot spliced into data[id=qres].value, so Mockoon boots with
  # the last persisted state. Falls back to the seed value when no snapshot
  # exists. See docs/mockoon-persistence.md.
  mockoon-seed:
    container_name: inkapp-mockoon-seed-local
    image: alpine:3
    volumes:
      - ./mockoon-snapshots:/snapshots:ro
      - ./samples/mockoon.json:/in/mockoon.json:ro
      - mockoon_runtime:/out
    environment:
      BUCKET_ID: "qres"
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        apk add --no-cache jq >/dev/null
        latest=$$(ls -1 "/snapshots/$${BUCKET_ID}-"*.json 2>/dev/null | sort | tail -n 1 || true)
        if [ -n "$$latest" ]; then
          echo "mockoon-seed: reseeding bucket '$$BUCKET_ID' from $$latest"
          jq --slurpfile snap "$$latest" --arg id "$$BUCKET_ID" '
            (.data[] | select(.id == $$id) | .value) |= ($$snap[0].value | tojson)
          ' /in/mockoon.json > /out/mockoon-config.json
        else
          echo "mockoon-seed: no snapshot found, using seed value from samples/mockoon.json"
          cp /in/mockoon.json /out/mockoon-config.json
        fi
    restart: "no"

  # Mockoon API Server
  mockoon:
    container_name: inkapp-mockoon-local
    image: mockoon/cli:latest
    command: --data "/cfg/mockoon-config.json" --port 3000
    depends_on:
      mockoon-seed:
        condition: service_completed_successfully
    volumes:
      - mockoon_runtime:/cfg
      - ./samples/fhir:/cfg/fhir:ro
    ports:
      - "3001:3000" # Different port to avoid conflicts
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 10s
      timeout: 5s
      retries: 3

  # Periodic snapshot of the Mockoon `qres` data bucket (QuestionnaireResponse store).
  # Dedupes by .value hash and applies generational retention (last 12h: all,
  # 12h–24h: hourly, 24h–7d: daily, 7d–35d: weekly, >35d: monthly). See
  # scripts/mockoon-snapshot.sh and docs/mockoon-persistence.md.
  mockoon-snapshot:
    container_name: inkapp-mockoon-snapshot-local
    image: alpine:3
    depends_on:
      mockoon:
        condition: service_healthy
    volumes:
      - ./mockoon-snapshots:/snapshots
      - ./scripts/mockoon-snapshot.sh:/snapshot.sh:ro
    environment:
      MOCKOON_URL: "http://mockoon:3000"
      SNAPSHOT_DIR: "/snapshots"
      SNAPSHOT_INTERVAL_SECONDS: "300"
      BUCKET_ID: "qres"
    entrypoint: [ "sh", "/snapshot.sh" ]
    restart: unless-stopped

  # OIDC Mock Server
  oidc-mock:
    container_name: inkapp-oidc-local
    build:
      context: .
      dockerfile: docker/oidc-mock.Dockerfile
    ports:
      - "8080:8080"
    environment:
      IDP_BASE_URL: ${IDP_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8080/.well-known/openid_configuration",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_local_data:
  mockoon_runtime:
  db_migrate_node_modules:
