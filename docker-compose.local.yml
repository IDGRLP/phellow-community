# Local Development Environment
# Mix of containerized and local services
# App runs locally, only infrastructure in containers
# Usage: docker-compose -f docker-compose.local.yml up

name: inkapp-local

services:
  # PostgreSQL Database
  db:
    container_name: inkapp-db-local
    image: postgres:17
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phellow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-phellow_local}
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
      - ./samples/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -d ${POSTGRES_DB:-phellow_local} -U
            ${POSTGRES_USER:-phellow}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot init container: rewrites samples/mockoon.json with the latest
  # qres snapshot spliced into data[id=qres].value, so Mockoon boots with
  # the last persisted state. Falls back to the seed value when no snapshot
  # exists. See docs/mockoon-persistence.md.
  mockoon-seed:
    container_name: inkapp-mockoon-seed-local
    image: alpine:3
    volumes:
      - ./mockoon-snapshots:/snapshots:ro
      - ./samples/mockoon.json:/in/mockoon.json:ro
      - mockoon_runtime:/out
    environment:
      BUCKET_ID: "qres"
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        apk add --no-cache jq >/dev/null
        latest=$$(ls -1 "/snapshots/$${BUCKET_ID}-"*.json 2>/dev/null | sort | tail -n 1 || true)
        if [ -n "$$latest" ]; then
          echo "mockoon-seed: reseeding bucket '$$BUCKET_ID' from $$latest"
          jq --slurpfile snap "$$latest" --arg id "$$BUCKET_ID" '
            (.data[] | select(.id == $$id) | .value) |= ($$snap[0].value | tojson)
          ' /in/mockoon.json > /out/mockoon-config.json
        else
          echo "mockoon-seed: no snapshot found, using seed value from samples/mockoon.json"
          cp /in/mockoon.json /out/mockoon-config.json
        fi
    restart: "no"

  # Mockoon API Server
  mockoon:
    container_name: inkapp-mockoon-local
    image: mockoon/cli:latest
    command: --data "/data/mockoon-config.json" --port 3000
    depends_on:
      mockoon-seed:
        condition: service_completed_successfully
    volumes:
      - mockoon_runtime:/data:ro
      - ./samples/fhir:/data/fhir:ro
    ports:
      - "3001:3000" # Different port to avoid conflicts
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 10s
      timeout: 5s
      retries: 3

  # Periodic snapshot of the Mockoon `qres` data bucket (QuestionnaireResponse store).
  # Mockoon CLI has no on-disk persistence, so the bucket is ephemeral; this sidecar
  # dumps it to ./mockoon-snapshots/ on the host every 5 minutes via the admin API.
  # See docs/mockoon-persistence.md.
  mockoon-snapshot:
    container_name: inkapp-mockoon-snapshot-local
    image: alpine:3
    depends_on:
      mockoon:
        condition: service_healthy
    volumes:
      - ./mockoon-snapshots:/snapshots
    environment:
      SNAPSHOT_INTERVAL_SECONDS: "300"
      SNAPSHOT_RETENTION_DAYS: "7"
      BUCKET_ID: "qres"
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        apk add --no-cache curl >/dev/null
        echo "mockoon-snapshot: dumping bucket '$$BUCKET_ID' every $${SNAPSHOT_INTERVAL_SECONDS}s to /snapshots (retention $${SNAPSHOT_RETENTION_DAYS}d)"
        while true; do
          ts=$$(date -u +%Y%m%dT%H%M%SZ)
          out="/snapshots/$${BUCKET_ID}-$${ts}.json"
          if curl -fsS "http://mockoon:3000/mockoon-admin/data-buckets/$${BUCKET_ID}" -o "$$out"; then
            echo "mockoon-snapshot: wrote $$out"
          else
            echo "mockoon-snapshot: dump failed at $$ts" >&2
          fi
          find /snapshots -name "$${BUCKET_ID}-*.json" -type f -mtime +$${SNAPSHOT_RETENTION_DAYS} -delete 2>/dev/null || true
          sleep "$$SNAPSHOT_INTERVAL_SECONDS"
        done
    restart: unless-stopped

  # OIDC Mock Server
  oidc-mock:
    container_name: inkapp-oidc-local
    build:
      context: .
      dockerfile: docker/oidc-mock.Dockerfile
    ports:
      - "8080:8080"
    environment:
      IDP_BASE_URL: ${IDP_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8080/.well-known/openid_configuration",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_local_data:
  mockoon_runtime:
